[project]
name = "zero-python"
version = "0.0.1"
description = "Community Python server SDK for Rocicorp Zero. Not affiliated with Rocicorp."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agent Labs" }]
keywords = ["zero", "rocicorp", "sync", "zql"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
