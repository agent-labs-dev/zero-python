[project]
name = "zero-server"
version = "0.0.2"
description = "Community Python server SDK for Rocicorp Zero. Not affiliated with Rocicorp."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agent Labs" }]
keywords = ["zero", "rocicorp", "sync", "zql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Floors are the lowest versions the suite passes on, and CI's `floors` job runs it at exactly these.
dependencies = ["orjson>=3.10.10", "pydantic>=2.12", "typing-extensions>=4.12"]

[project.urls]
Homepage = "https://github.com/agent-labs-dev/zero-python"
Source = "https://github.com/agent-labs-dev/zero-python"
Issues = "https://github.com/agent-labs-dev/zero-python/issues"
Changelog = "https://github.com/agent-labs-dev/zero-python/releases"

[project.scripts]
zero-server = "zero_server.codegen:main"

[project.optional-dependencies]
# The engine's driver is the caller's: add `asyncpg`, or install psycopg yourself.
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.40"]
asyncpg = ["asyncpg>=0.30"]
psycopg = ["psycopg>=3.2.10", "psycopg-pool>=3.2.6"]
starlette = ["starlette>=1.6"]

[dependency-groups]
dev = [
    "zero-server[sqlalchemy,asyncpg,psycopg,starlette]",
    "httpx2>=2.13",
    # psycopg's prebuilt libpq, so the tests need no system libpq.
    "psycopg[binary]>=3.2.10",
    "hypothesis>=6.169",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "ty>=0.0.87",
    "pytest-codspeed>=5.0.3",
]

# The Python app server of the end-to-end tier.
e2e = ["starlette>=1.6", "uvicorn>=0.54"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=zero_server --cov-branch --cov-context=test --cov-report=term-missing"

[tool.coverage.run]
# SQLAlchemy's asyncio layer resumes coroutines inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]
